name: Build Windows desktop
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true
      - name: Validate and build
        shell: pwsh
        run: ./build_windows.ps1
      - name: Include runtime and create installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'build/windows/x64/runner/Release'
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'MSVC runtime not found' }
          Copy-Item "$($crt.FullName)/*.dll" $release
          Compress-Archive -Path "$release/*" -DestinationPath 'dist/Ls_BLE_Guided_Windows_x64.zip' -Force
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Check application and installer start
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Start-Process -FilePath (Resolve-Path 'build/windows/x64/runner/Release/Ls_BLE_Guided.exe') -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Application exited early: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
          $setup = Start-Process -FilePath (Resolve-Path 'dist/Ls_BLE_Guided_Windows_Setup.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=C:\ble-install-test' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          if (-not (Test-Path 'C:/ble-install-test/Ls_BLE_Guided.exe')) { throw 'Installed executable missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: Ls-BLE-Guided-Windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-1.3.3-build.${{ github.run_number }}"
          gh release create $tag dist/Ls_BLE_Guided_Windows_Setup.exe dist/Ls_BLE_Guided_Windows_x64.zip --target '${{ github.sha }}' --title "Ls BLE Guided Windows 1.3.3 (build ${{ github.run_number }})" --notes "Scarica Ls_BLE_Guided_Windows_Setup.exe e aprilo per installare l'app. Include le librerie necessarie. Compilazione, test automatici e avvio verificati su Windows. Il collegamento BLE con adattatore Realtek e dispositivi fisici deve essere verificato sul PC. Installer non firmato digitalmente. In alternativa e disponibile lo ZIP portatile."
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
