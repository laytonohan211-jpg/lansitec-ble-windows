name: Build Windows desktop
on:
  push:
    branches: [security-review-windows]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: false
      - name: Prepare dependencies
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Flutter configuration failed' }
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed' }
      - name: Record dependency inventory
        shell: pwsh
        run: |
          python tools/release_inventory.py
          if ($LASTEXITCODE -ne 0) { throw 'Inventory failed' }
      - name: Apply pinned Windows connection fix
        shell: pwsh
        run: |
          python tools/patch_winrt_connection.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows connection patch failed' }
      - name: Analyze code
        shell: pwsh
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          if ($LASTEXITCODE -ne 0) { throw 'Code analysis failed' }
      - name: Run regression tests
        timeout-minutes: 5
        shell: pwsh
        run: |
          flutter test test/guided --timeout 60s
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          node test/guided/livestock_decoder_test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Livestock decoder tests failed' }
      - name: Compile Windows application
        timeout-minutes: 20
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed' }
          if (-not (Test-Path 'build/windows/x64/runner/Release/Ls_BLE_Guided.exe')) { throw 'Executable missing' }
          New-Item -ItemType Directory -Force dist | Out-Null
      - name: Include runtime and create installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'build/windows/x64/runner/Release'
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'MSVC runtime not found' }
          Copy-Item "$($crt.FullName)/*.dll" $release
          Copy-Item dist/THIRD_PARTY_NOTICES.txt $release
          Compress-Archive -Path "$release/*" -DestinationPath 'dist/Ls_BLE_Guided_Windows_x64.zip' -Force
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'Pinned runner installer compiler unavailable' }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Check application and installer start
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Start-Process -FilePath (Resolve-Path 'build/windows/x64/runner/Release/Ls_BLE_Guided.exe') -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Application exited early: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
          $setup = Start-Process -FilePath (Resolve-Path 'dist/Ls_BLE_Guided_Windows_Setup.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=C:\ble-install-test' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          if (-not (Test-Path 'C:/ble-install-test/Ls_BLE_Guided.exe')) { throw 'Installed executable missing' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ls-BLE-Guided-Windows-x64
          path: dist/*
          if-no-files-found: error

