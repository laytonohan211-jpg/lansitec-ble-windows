name: Build Android LoRaWAN
on:
  push:
    branches: [security-review-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.10.2'
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Record dependency inventory
        run: python3 tools/release_inventory.py
      - name: Analyze
        run: flutter analyze lib test/guided --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: |
          flutter test test/guided --timeout 60s
          node test/guided/decoder_security_test.cjs
          node test/guided/livestock_decoder_test.cjs
      - name: Prepare Android wrapper
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          gradle -p android wrapper --gradle-version 8.10.2
      - name: Build APK
        run: flutter build apk --release
      - name: Record native dependencies
        run: gradle -p android -I ../tools/dependency-inventory.gradle inventoryReleaseDependencies
      - name: Collect build candidate
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk dist/UNSIGNED-app.apk
          sha256sum dist/UNSIGNED-app.apk > dist/BUILD_SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ls-BLE-Guided-Android-candidate
          path: dist/*
          if-no-files-found: error


